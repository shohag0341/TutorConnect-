<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ড্যাশবোর্ড</title>
<meta name="theme-color" content="#0E1A33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header id="site-header"></header>

<main class="container" style="max-width:820px;padding-bottom:32px">
  <div class="page-head">
    <h1>ড্যাশবোর্ড</h1>
    <p class="muted" id="hello"></p>
  </div>

  <nav class="tabs" id="tabs">
    <a class="tab" data-tab="overview" href="#overview">ওভারভিউ</a>
    <a class="tab" data-tab="messages" href="#messages">মেসেজ<span id="b-msg"></span></a>
    <a class="tab" data-tab="notifications" href="#notifications">নোটিফিকেশন<span id="b-notif"></span></a>
    <a class="tab" data-tab="favourites" href="#favourites">পছন্দের টিউটর</a>
  </nav>

  <div id="msg" hidden></div>
  <div id="panel"></div>
</main>

<nav id="bottom-nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const { user } = await App.mount('account');
  const msg = $('msg'), panel = $('panel');
  if (!App.configured) return App.showAlert(msg, 'error', 'আগে assets/js/config.js ফাইলে Supabase তথ্য বসান।');
  if (!user) { location.href = 'login.html?next=dashboard.html'; return; }
  const sb = App.sb;
  let poll = null;

  const fmt = (ts) => new Date(ts).toLocaleString('bn-BD', { dateStyle: 'medium', timeStyle: 'short' });
  const STATUS = { open: 'উত্তরের অপেক্ষায়', pending: 'উত্তর এসেছে', resolved: 'সমাধান হয়েছে' };
  const VS = { none: 'যাচাই করা হয়নি', pending: 'যাচাই চলছে', verified: 'Verified ✔', rejected: 'প্রত্যাখ্যাত' };
  const mapLink = (l) => { const m = /^\/dashboard\/messages\/(.+)$/.exec(l || ''); return m ? '#messages/' + m[1] : '#overview'; };
  const linkify = (t) => App.esc(t).replace(/https?:\/\/[^\s]+/g, (u) =>
    u.indexOf(App.esc(location.origin)) === 0 ? '<a href="' + u + '">' + u + '</a>' : u);
  const loading = () => { panel.innerHTML = '<div class="skeleton" style="height:90px"></div>'; };
  const fail = (e) => { console.error(e); panel.innerHTML = ''; App.showAlert(msg, 'error', App.errMsg(e)); };

  // নাম
  const { data: me } = await sb.from('profiles').select('full_name').eq('id', user.id).maybeSingle();
  $('hello').textContent = 'স্বাগতম, ' + ((me && me.full_name) || '');

  // ব্যাজ (নতুন মেসেজ / নোটিফিকেশন)
  async function badges() {
    const [a, b] = await Promise.all([
      sb.from('support_threads').select('id', { count: 'exact', head: true }).eq('user_id', user.id).eq('status', 'pending'),
      sb.from('notifications').select('id', { count: 'exact', head: true }).eq('user_id', user.id).eq('is_read', false)
    ]);
    const set = (id, n) => { $(id).innerHTML = n ? '<span class="dot">' + App.bn(n) + '</span>' : ''; };
    set('b-msg', a.count); set('b-notif', b.count);
  }

  // ---------- ওভারভিউ ----------
  async function overview() {
    loading();
    const [tp, th, nf, fv] = await Promise.all([
      sb.from('tutor_profiles').select('verify_status').eq('user_id', user.id).maybeSingle(),
      sb.from('support_threads').select('id', { count: 'exact', head: true }).eq('user_id', user.id).neq('status', 'resolved'),
      sb.from('notifications').select('id', { count: 'exact', head: true }).eq('user_id', user.id).eq('is_read', false),
      sb.from('fav_tutors').select('tutor_id', { count: 'exact', head: true }).eq('user_id', user.id)
    ]);
    const t = tp.data;
    panel.innerHTML =
      '<div class="stat-grid">' +
        '<a class="card stat card-lift" href="#messages"><b>' + App.bn(th.count || 0) + '</b><span class="muted">চলমান আলোচনা</span></a>' +
        '<a class="card stat card-lift" href="#notifications"><b>' + App.bn(nf.count || 0) + '</b><span class="muted">নতুন নোটিফিকেশন</span></a>' +
        '<a class="card stat card-lift" href="#favourites"><b>' + App.bn(fv.count || 0) + '</b><span class="muted">পছন্দের টিউটর</span></a>' +
      '</div>' +
      '<div class="card stack">' +
        (t
          ? '<h3 style="margin:0">আমার টিউটর প্রোফাইল</h3><p style="margin:0">অবস্থা: <span class="badge ' + (t.verify_status === 'verified' ? 'badge-verified' : 'badge-gold') + '">' + VS[t.verify_status] + '</span></p>' +
            '<div class="action-row"><a class="btn btn-primary btn-sm" href="become-tutor.html">প্রোফাইল সম্পাদনা</a><a class="btn btn-ghost btn-sm" href="tutor.html?id=' + encodeURIComponent(user.id) + '">পাবলিক ভিউ</a></div>'
          : '<h3 style="margin:0">টিউটর হিসেবে কাজ করতে চান?</h3><p class="muted" style="margin:0">প্রোফাইল তৈরি করলে অভিভাবকরা আপনাকে খুঁজে পাবেন।</p><div><a class="btn btn-gold btn-sm" href="become-tutor.html">টিউটর প্রোফাইল তৈরি করুন</a></div>') +
      '</div>' +
      '<div class="card stack" style="margin-top:16px"><h3 style="margin:0">দ্রুত কাজ</h3>' +
        '<div class="action-row"><a class="btn btn-ghost btn-sm" href="find-tutor.html">টিউটর খুঁজুন</a><a class="btn btn-ghost btn-sm" href="#messages">সাপোর্টে মেসেজ করুন</a></div></div>';
  }

  // ---------- মেসেজ তালিকা ----------
  async function messages() {
    loading();
    const [r, u] = await Promise.all([
      sb.from('support_threads').select('id, subject, status, updated_at').eq('user_id', user.id).order('updated_at', { ascending: false }),
      sb.from('notifications').select('link').eq('user_id', user.id).eq('is_read', false).like('link', '/dashboard/messages/%')
    ]);
    if (r.error) return fail(r.error);
    const unread = new Set((u.data || []).map((n) => n.link));

    panel.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="margin:0">আমার মেসেজ</h3>' +
      '<button class="btn btn-primary btn-sm" id="new-btn" type="button">+ নতুন বার্তা</button></div>' +
      '<form class="card stack" id="new-form" hidden style="margin-bottom:16px">' +
        '<div class="field" style="margin:0"><label for="n-sub">বিষয়</label><input class="input" id="n-sub" maxlength="100" placeholder="যেমন: টিউটর খুঁজতে সাহায্য চাই"></div>' +
        '<div class="field" style="margin:0"><label for="n-body">বার্তা</label><textarea class="input" id="n-body" rows="4" maxlength="1000"></textarea></div>' +
        '<button class="btn btn-primary" type="submit">পাঠান</button></form>' +
      '<div class="stack">' +
      ((r.data || []).length
        ? r.data.map((t) =>
            '<a class="card card-lift list-item' + (unread.has('/dashboard/messages/' + t.id) ? ' unread' : '') + '" href="#messages/' + t.id + '">' +
            '<div><b>' + App.esc(t.subject) + '</b><div class="muted" style="font-size:.85rem">' + fmt(t.updated_at) + '</div></div>' +
            '<span class="badge badge-gold">' + STATUS[t.status] + '</span></a>').join('')
        : '<div class="empty">এখনো কোনো মেসেজ নেই।</div>') + '</div>';

    $('new-btn').addEventListener('click', () => { $('new-form').hidden = !$('new-form').hidden; });
    $('new-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const sub = $('n-sub').value.trim(), body = $('n-body').value.trim();
      if (!sub || !body) return App.toast('বিষয় ও বার্তা দুটোই লিখুন');
      const th = await sb.from('support_threads').insert({ user_id: user.id, subject: sub }).select('id').single();
      if (th.error) return App.toast(App.errMsg(th.error));
      const m = await sb.from('support_messages').insert({ thread_id: th.data.id, body });
      if (m.error) return App.toast(App.errMsg(m.error));
      location.hash = '#messages/' + th.data.id;
    });
  }

  // ---------- একটি আলোচনা (চ্যাট) ----------
  async function thread(id) {
    loading();
    const { data: t, error } = await sb.from('support_threads').select('id, subject, status').eq('id', id).eq('user_id', user.id).maybeSingle();
    if (error) return fail(error);
    if (!t) { panel.innerHTML = '<div class="empty">আলোচনাটি পাওয়া যায়নি।</div>'; return; }

    panel.innerHTML =
      '<a href="#messages" class="muted" style="display:inline-block;margin-bottom:10px">← সব মেসেজ</a>' +
      '<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px">' +
      '<h3 style="margin:0">' + App.esc(t.subject) + '</h3><span class="badge badge-gold" id="t-status">' + STATUS[t.status] + '</span></div>' +
      '<div class="chat" id="chat"></div>' +
      '<form class="composer" id="composer"><textarea class="input" id="c-body" rows="1" maxlength="1000" placeholder="আপনার বার্তা লিখুন..."></textarea>' +
      '<button class="btn btn-primary" type="submit">পাঠান</button></form></div>';

    let lastCount = -1;
    async function load() {
      const r = await sb.from('support_messages').select('id, body, from_staff, created_at').eq('thread_id', id).order('created_at');
      if (r.error) return;
      if (r.data.length === lastCount) return;
      lastCount = r.data.length;
      const chat = $('chat');
      if (!chat) return;
      chat.innerHTML = r.data.map((m) =>
        '<div class="bubble ' + (m.from_staff ? 'them' : 'me') + '">' + (m.from_staff ? '<b style="font-size:.78rem">সাপোর্ট টিম</b><br>' : '') + linkify(m.body) + '<small>' + fmt(m.created_at) + '</small></div>').join('');
      chat.scrollTop = chat.scrollHeight;
    }
    await load();

    // এই আলোচনার নোটিফিকেশন পড়া হয়েছে চিহ্নিত
    await sb.from('notifications').update({ is_read: true }).eq('user_id', user.id).eq('link', '/dashboard/messages/' + id).eq('is_read', false);
    badges();

    poll = setInterval(load, 8000);   // প্রতি ৮ সেকেন্ডে নতুন বার্তা দেখে

    $('composer').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = $('c-body').value.trim();
      if (!body) return;
      $('c-body').value = '';
      const m = await sb.from('support_messages').insert({ thread_id: id, body });
      if (m.error) { $('c-body').value = body; return App.toast(App.errMsg(m.error)); }
      lastCount = -1; await load();
    });
  }

  // ---------- নোটিফিকেশন ----------
  async function notifications() {
    loading();
    const r = await sb.from('notifications').select('id, title, body, link, is_read, created_at').eq('user_id', user.id).order('created_at', { ascending: false }).limit(50);
    if (r.error) return fail(r.error);
    const hasUnread = (r.data || []).some((n) => !n.is_read);
    panel.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="margin:0">নোটিফিকেশন</h3>' +
      (hasUnread ? '<button class="btn btn-ghost btn-sm" id="read-all" type="button">সব পড়া হয়েছে</button>' : '') + '</div>' +
      '<div class="stack">' +
      ((r.data || []).length
        ? r.data.map((n) =>
            '<a class="card card-lift list-item' + (n.is_read ? '' : ' unread') + '" data-id="' + n.id + '" href="' + mapLink(n.link) + '">' +
            '<div><b>' + App.esc(n.title) + '</b>' + (n.body ? '<div class="muted" style="font-size:.88rem">' + App.esc(n.body) + '</div>' : '') +
            '<div class="muted" style="font-size:.78rem;margin-top:4px">' + fmt(n.created_at) + '</div></div></a>').join('')
        : '<div class="empty">কোনো নোটিফিকেশন নেই।</div>') + '</div>';

    panel.querySelectorAll('a[data-id]').forEach((a) => a.addEventListener('click', () => {
      sb.from('notifications').update({ is_read: true }).eq('id', a.dataset.id).then(badges);
    }));
    const ra = $('read-all');
    if (ra) ra.addEventListener('click', async () => {
      await sb.from('notifications').update({ is_read: true }).eq('user_id', user.id).eq('is_read', false);
      notifications(); badges();
    });
  }

  // ---------- পছন্দের টিউটর ----------
  async function favourites() {
    loading();
    const f = await sb.from('fav_tutors').select('tutor_id').eq('user_id', user.id).order('created_at', { ascending: false });
    if (f.error) return fail(f.error);
    const ids = (f.data || []).map((x) => x.tutor_id);
    if (!ids.length) { panel.innerHTML = '<div class="empty">এখনো কাউকে সংরক্ষণ করেননি। <a href="find-tutor.html"><b>টিউটর খুঁজুন →</b></a></div>'; return; }
    const t = await sb.from('public_tutors').select('user_id, full_name, avatar_url, institution, is_verified, subjects').in('user_id', ids);
    if (t.error) return fail(t.error);
    panel.innerHTML = '<h3>পছন্দের টিউটর</h3><div class="list">' + (t.data || []).map((x) =>
      '<a class="card card-lift tutor-card" href="tutor.html?id=' + encodeURIComponent(x.user_id) + '"><div class="top"><div class="avatar avatar-sm">' +
      (x.avatar_url ? '<img alt="" src="' + App.esc(x.avatar_url) + '">' : App.esc((x.full_name || 'ট').charAt(0))) + '</div><div><h3>' + App.esc(x.full_name) +
      (x.is_verified ? ' <span class="badge badge-verified">✔ Verified</span>' : '') + '</h3><div class="sub">' + App.esc(x.institution || '') + '</div></div></div>' +
      '<div class="tag-row">' + (x.subjects || []).slice(0, 3).map((s) => '<span class="chip">' + App.esc(s) + '</span>').join('') + '</div></a>').join('') + '</div>';
  }

  // ---------- রাউটার (#overview, #messages, #messages/ID ...) ----------
  function route() {
    clearInterval(poll);
    msg.hidden = true;
    const [tab, arg] = (location.hash || '#overview').slice(1).split('/');
    const key = ['overview', 'messages', 'notifications', 'favourites'].includes(tab) ? tab : 'overview';
    document.querySelectorAll('.tab').forEach((a) => a.classList.toggle('active', a.dataset.tab === key));
    badges();
    if (key === 'messages') return arg ? thread(arg) : messages();
    ({ overview, notifications, favourites })[key]();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
